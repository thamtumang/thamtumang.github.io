<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650"><g font-family="Arial, sans-serif"><rect x="0" y="0" width="900" height="650" fill="#f7eff4" rx="0"/><rect x="0" y="0" width="900" height="97" fill="#a91866" rx="0"/><text x="37" y="65" font-size="53" fill="white" font-weight="700" >MoMi</text><text x="860" y="59" font-size="25" fill="white" font-weight="700" text-anchor="end">HỖ TRỢ GIAO DỊCH</text><text x="450" y="167" font-size="42" fill="#a91866" font-weight="700" text-anchor="middle">THÔNG BÁO HOÀN TIỀN</text><text x="450" y="213" font-size="26" fill="#5d4654" font-weight="400" text-anchor="middle">Giao dịch lỗi trong ngày 15–17/10</text><rect x="67" y="251" width="766" height="167" fill="white" rx="8"/><text x="98" y="296" font-size="26" fill="#202124" font-weight="400" >Nạp điện thoại / thanh toán không thành công</text><text x="98" y="356" font-size="48" fill="#a91866" font-weight="700" >HOÀN LẠI 100%</text><text x="98" y="394" font-size="25" fill="#675660" font-weight="400" >số tiền giao dịch bị trừ</text><text x="84" y="472" font-size="28" fill="#202124" font-weight="400" >1. Bình luận số điện thoại + số tiền bị lỗi</text><text x="84" y="518" font-size="28" fill="#202124" font-weight="400" >2. Chờ nhân viên liên hệ hỗ trợ xác minh</text><rect x="0" y="561" width="900" height="89" fill="#a91866" rx="0"/><text x="450" y="601" font-size="28" fill="white" font-weight="700" text-anchor="middle">TIẾP NHẬN YÊU CẦU TRONG 48 GIỜ</text><text x="450" y="632" font-size="20" fill="white" font-weight="400" text-anchor="middle">Ví MoMi – Trung Tâm Hoàn Tiền</text></g></svg>