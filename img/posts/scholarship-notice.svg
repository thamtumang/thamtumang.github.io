<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1050" viewBox="0 0 840 1050"><g font-family="Arial, sans-serif"><rect x="0" y="0" width="840" height="1050" rx="0" fill="#fbfbfa"/><text x="55" y="66" font-size="19" fill="#252a30" font-weight="600">TRƯỜNG ĐẠI HỌC SAO MAI</text><text x="55" y="94" font-size="19" fill="#252a30" font-weight="600">PHÒNG CÔNG TÁC SINH VIÊN</text><text x="580" y="66" font-size="20" fill="#252a30" font-weight="400">Năm học 2026–2027</text><text x="55" y="148" font-size="19" fill="#252a30" font-weight="400">Số: 20/TB-CTSV</text><text x="785" y="148" font-size="19" fill="#252a30" font-weight="400" text-anchor="end">Ngày 20 tháng 10 năm 2026</text><rect x="55" y="180" width="730" height="1" rx="0" fill="#aeb4bd"/><text x="420" y="244" font-size="32" fill="#252a30" font-weight="700" text-anchor="middle">THÔNG BÁO</text><text x="420" y="286" font-size="25" fill="#252a30" font-weight="600" text-anchor="middle">Về việc xét học bổng khuyến khích học tập</text><text x="420" y="325" font-size="24" fill="#252a30" font-weight="400" text-anchor="middle">Học kỳ 1, năm học 2026–2027</text><text x="66" y="398" font-size="23" fill="#252a30" font-weight="400">1. Đối tượng</text><text x="66" y="435" font-size="23" fill="#252a30" font-weight="400">Sinh viên chính quy có điểm trung bình từ 3,2</text><text x="66" y="472" font-size="23" fill="#252a30" font-weight="400">và điểm rèn luyện từ loại Tốt.</text><text x="66" y="509" font-size="23" fill="#252a30" font-weight="400"></text><text x="66" y="546" font-size="23" fill="#252a30" font-weight="400">2. Hồ sơ</text><text x="66" y="583" font-size="23" fill="#252a30" font-weight="400">Đơn theo mẫu; bảng điểm có xác nhận của khoa.</text><text x="66" y="620" font-size="23" fill="#252a30" font-weight="400"></text><text x="66" y="657" font-size="23" fill="#252a30" font-weight="400">3. Thời gian và địa điểm</text><text x="66" y="694" font-size="23" fill="#252a30" font-weight="400">Từ 20/10 đến 31/10, trong giờ hành chính.</text><text x="66" y="731" font-size="23" fill="#252a30" font-weight="400">Nộp trực tiếp tại phòng A1.105.</text><text x="66" y="768" font-size="23" fill="#252a30" font-weight="400"></text><text x="66" y="805" font-size="23" fill="#252a30" font-weight="400">4. Kinh phí</text><text x="66" y="842" font-size="23" fill="#252a30" font-weight="400">Nhà trường không thu phí hồ sơ.</text><text x="766" y="956" font-size="20" fill="#252a30" font-weight="600" text-anchor="end">PHÒNG CÔNG TÁC SINH VIÊN</text><text x="66" y="1018" font-size="16" fill="#78818c" font-weight="400">Bản thông báo trong tình huống mô phỏng.</text></g></svg>