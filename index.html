<!DOCTYPE html> 
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Thám Tử Mạng - Hồ Sơ Lừa Đảo</title>
  <meta name="description" content="Game giáo dục giúp học sinh nhận biết và phòng tránh lừa đảo trên mạng.">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fonts.css?v=1019d">
  <link rel="stylesheet" href="css/style.css?v=1019d">
</head>
<body>
  <script>
    // Hiện lỗi ngay trên màn hình để dễ chụp gửi người làm game
    window.addEventListener('error', function (e) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:99999;background:#fde8e8;color:#9b1c1c;border:1px solid #f5b5b5;border-radius:8px;padding:8px 10px;font:12px/1.4 monospace;word-break:break-word';
      d.textContent = 'Lỗi: ' + e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ')';
      d.onclick = function () { d.remove(); };
      document.body.appendChild(d);
    });
  </script>
  <!-- Màn hình khóa / đăng nhập -->
  <div id="lock" class="hidden"></div>

  <!-- Màn hình desktop -->
  <div id="desktop">
    <div id="icons"></div>
    <div id="windows"></div>
  </div>

  <!-- Menu Start -->
  <div id="start-menu" class="hidden"></div>

  <!-- Thanh taskbar -->
  <div id="taskbar">
    <div id="tb-center">
      <button id="start-btn" title="Bắt đầu"></button>
      <button id="tb-search"><span class="tbs-ico"></span><span class="tbs-text">Tìm kiếm</span></button>
      <div id="task-apps"></div>
    </div>
    <div id="tray">
      <div class="tray-item" id="tray-hp" title="Máu">
        <span id="hp-ico"></span>
        <div class="hpbar"><div id="hp-fill"></div></div>
        <span id="hp-text"></span>
      </div>
      <div class="tray-item" title="Tiền thưởng"><span id="money-ico"></span><span id="money-text"></span></div>
      <div class="tray-item hide-sm" title="Tổng số sao"><span id="star-ico"></span><span id="star-text"></span></div>
      <div class="tray-sys hide-sm" id="tray-sys"></div>
      <div class="tray-clock hide-sm"><span id="clock"></span><span id="date"></span></div>
    </div>
  </div>

  <!-- Bác Tư hướng dẫn -->
  <div id="tutor" class="hidden"></div>

  <!-- Hộp thoại thông báo -->
  <div id="modal-bg" class="hidden"><div id="modal"></div></div>
  <div id="toasts"></div>

  <script src="js/config.js?v=1019d"></script>
  <script src="js/icons.js?v=1019d"></script>
  <script src="js/store.js?v=1019d"></script>
  <script src="js/data.js?v=1019d"></script>
  <script src="js/game.js?v=1019d"></script>
</body>
</html>
